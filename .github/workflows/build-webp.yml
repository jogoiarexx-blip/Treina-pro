name: Build TreinaPro WebP assets
on:
  push:
    branches: [main]
    paths:
      - 'build_webp_assets.py'
      - '.github/workflows/build-webp.yml'
      - 'assets/exercises/**'
      - 'assets/frames/**'
      - 'assets/still/**'
      - 'app.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image conversion dependencies
        run: python -m pip install "pillow>=10,<13" "cairosvg>=2.7,<3"
      - name: Generate 121 optimized WebP assets
        run: python build_webp_assets.py
      - name: Verify images and file count
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=list(Path('assets/webp').rglob('*.webp'))
          assert len(paths)==121, f'Expected 121 assets, found {len(paths)}'
          for p in paths:
              data=p.read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', str(p)
          print('Validated',len(paths),'WebP files')
          PY
      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/webp
          if git diff --cached --quiet; then
            echo "WebP outputs already up to date."
          else
            git commit -m "assets: generate 121 TreinaPro WebP images [skip ci]"
            git push origin HEAD:main
          fi
