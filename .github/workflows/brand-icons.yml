name: TreinaPro - atualizar icones do aplicativo
on:
  push:
    branches: [main]
    paths:
      - 'assets/treinapro-icon.svg'
      - '.github/workflows/brand-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar conversor SVG para PNG
        run: python -m pip install "cairosvg>=2.7,<3"
      - name: Gerar icones de instalacao a partir da marca oficial
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source = "assets/treinapro-icon.svg"
          for size in (192, 512):
              dest = Path(f"assets/icon-{size}.png")
              cairosvg.svg2png(url=source, write_to=str(dest), output_width=size, output_height=size)
              assert dest.read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
              print(dest, dest.stat().st_size, "bytes")
          PY
      - name: Salvar PNGs gerados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png
          if git diff --cached --quiet; then
            echo "Os icones ja estao atualizados."
          else
            git commit -m "brand: regenerate TreinaPro install icons"
            git push
          fi
